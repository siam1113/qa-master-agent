services:
  app:
    build: .
    ports:
      - "5050:5050"
    environment:
      NODE_ENV: production
      PORT: 5050
      MONGO_URI: mongodb://mongo:27017/qa-master-agent
      POSTGRES_URL: postgres://qa:qa@postgres:5432/qa_master_agent
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
    depends_on: [mongo, postgres, neo4j, redis]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa_master_agent
    ports: ["5432:5432"]
    volumes:
      - ./infra/db/postgres.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - ./infra/db/neo4j.cypher:/schema.cypher:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
